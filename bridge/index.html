<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="phonechatXI">
<meta name="theme-color" content="#0b1020">
<title>phonechatXI</title>
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<link rel="icon" type="image/png" href="/icons/favicon-32.png">
<style>
/* Fonts ship with the bridge (OFL). Nothing is loaded from outside your network. */
@font-face{font-family:'Cinzel';font-weight:600;font-display:swap;src:url(/fonts/cinzel-latin-600-normal.woff2) format('woff2')}
@font-face{font-family:'Cinzel';font-weight:700;font-display:swap;src:url(/fonts/cinzel-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible';font-weight:400;font-display:swap;src:url(/fonts/atkinson-hyperlegible-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible';font-weight:700;font-display:swap;src:url(/fonts/atkinson-hyperlegible-latin-700-normal.woff2) format('woff2')}
@font-face{font-family:'Atkinson Hyperlegible';font-weight:400;font-style:italic;font-display:swap;src:url(/fonts/atkinson-hyperlegible-latin-400-italic.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:400;font-display:swap;src:url(/fonts/jetbrains-mono-latin-400-normal.woff2) format('woff2')}
@font-face{font-family:'JetBrains Mono';font-weight:700;font-display:swap;src:url(/fonts/jetbrains-mono-latin-700-normal.woff2) format('woff2')}
:root{
  --bg:#0b1020; --pane:#0e1530; --raise:#12182f; --chip:#171f40; --line:#1d2850; --edge:#2c3a6e; --edge2:#3a4a80;
  --text:#e8ecf6; --soft:#c9d2ec; --mute:#8e9ac0; --gold:#d9b45a; --ink:#1a1405;
  --ls1:#7ee08f; --ls2:#4fd6c8; --party:#7fb2ff; --tell:#ff8fd0; --unity:#e8c35c; --shout:#ff9a5c; --yell:#c98a5c;
  --emote:#b9a6ff; --finder:#8fd0ff; --say:#dfe5f5; --vent:#f0b24d; --sys:#8e9ac0; --bad:#ff9a9a; --badbg:#2a1418; --badedge:#5a2a2a; --ok:#7ee08f;
  --fs:15.5px; --serif:'Cinzel',Georgia,serif; --sans:'Atkinson Hyperlegible',system-ui,-apple-system,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
  --safe-b:env(safe-area-inset-bottom,0px); --safe-t:env(safe-area-inset-top,0px);
}
body.size-S{--fs:14px} body.size-L{--fs:17.5px}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input{font:inherit}
#app{position:fixed;left:0;right:0;top:0;bottom:0;display:flex;flex-direction:column;overflow:hidden}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);padding-top:var(--safe-t)}
.overlay{transform:translateX(100%);transition:transform .22s ease;z-index:5}
#main{bottom:var(--tabh,0px)}
.overlay.tabs{bottom:var(--tabh,0px)}
.overlay.open{transform:none}
.tab{display:none;flex:1;min-height:0;flex-direction:column}
.tab.on{display:flex}
.cpanel{flex:1;min-height:0;display:flex;flex-direction:column}
.cpanel[hidden]{display:none}
#cmdseg{flex:0 1 auto;margin:0 auto}
/* your own lines: a faint wash so they're easy to spot */
.run.out,.cl.out{background:color-mix(in srgb,var(--c) 8%,transparent);border-radius:8px}
.run.out{margin:0 -6px;padding:2px 6px}
/* mentions */
.mention{background:color-mix(in srgb,var(--gold) 9%,transparent);border-radius:8px}
mark.mw{background:none;color:var(--gold);font-weight:700}
/* auto-translate phrases (not links) */
.at{color:#9fe3a6;color:color-mix(in srgb,var(--ok) 75%,var(--text))}
/* LS message of the day, pinned */
.motd{margin:6px 10px 0;padding:7px 10px;border:1px solid var(--edge);border-radius:10px;background:var(--raise);font-size:13.5px;color:var(--soft);display:flex;gap:8px;align-items:flex-start}
.motd b{color:var(--c);flex:none}
.motd .x{margin-left:auto;color:var(--mute);flex:none;padding:0 2px}
.motd.min span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
/* new lines ease in */
@keyframes fresh{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fresh{animation:fresh .16s ease-out}
@media (prefers-reduced-motion:reduce){.fresh,.picked,.tgt.bump{animation:none}}
.top{display:flex;align-items:center;justify-content:space-between;padding:14px 16px 4px}
.big{font-family:var(--serif);font-weight:700;font-size:28px}
.row{display:flex;align-items:center;gap:10px}
.pill-on{display:flex;align-items:center;gap:6px;font-size:12px;border-radius:999px;padding:4px 10px;border:1px solid #1f4a33;color:var(--ok)}
.pill-on i{width:7px;height:7px;border-radius:50%;background:currentColor;display:block}
.pill-on.off{border-color:var(--badedge);color:var(--bad)}
.iconbtn{width:34px;height:34px;border-radius:50%;border:1px solid var(--edge);display:flex;align-items:center;justify-content:center}
.bar{display:flex;align-items:center;padding:12px 10px 8px;border-bottom:1px solid var(--line);gap:4px}
.back{display:flex;align-items:center;color:var(--gold);font-size:16px;min-width:76px}
.bar .mid{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.bar .mid b{font-size:17px}
.bar .mid small{font-size:12px;color:var(--mute)}
.bar .end{min-width:76px;display:flex;justify-content:flex-end}
svg.i{flex:none}

/* view switcher and pills */
.views{display:flex;align-items:center;gap:8px;padding:6px 12px 2px}
.seg{flex:1;display:flex;border:1px solid var(--edge);border-radius:10px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1 0 auto;padding:7px 12px;font-size:13.5px;color:var(--mute);white-space:nowrap}
.seg button.on{background:var(--gold);color:var(--ink);font-weight:700}
.pencil{flex:none;width:36px;height:34px;border-radius:10px;border:1px solid var(--edge);display:flex;align-items:center;justify-content:center}
.pills{display:flex;gap:8px;padding:8px 12px 8px;overflow-x:auto;scrollbar-width:none}
.pills::-webkit-scrollbar{display:none}
.chipb{flex:none;position:relative;display:flex;align-items:center;gap:6px;padding:6px 11px;border:1px solid var(--edge);border-radius:999px;font-size:13.5px;color:var(--mute)}
.chipb svg{opacity:.45}
.chipb.on{border-color:var(--gold);background:var(--chip);color:var(--text)}
.chipb.on svg{opacity:1}
.chipb .callflag{position:absolute;top:-7px;right:-4px;font-size:9px;font-weight:700;letter-spacing:.4px;color:var(--vent);background:#2b2210;border:1px solid #5a4620;border-radius:5px;padding:0 4px;line-height:14px}

/* chat pane */
.panewrap{flex:1;min-height:0;position:relative;margin:0 10px}
.pane{position:absolute;inset:0;border:1px solid var(--edge2);border-radius:10px;background:var(--pane);box-shadow:inset 0 0 0 1px var(--bg),inset 0 0 24px #101a3d;overflow-y:auto;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;overscroll-behavior:contain}
.pane .inner{margin-top:auto;padding:10px 12px;display:flex;flex-direction:column;gap:11px}
body.compact .pane .inner{gap:5px}
.empty{color:var(--mute);font-size:14px;text-align:center;padding:30px 10px;line-height:1.5}
.div{display:flex;align-items:center;gap:8px;font-size:11px;color:var(--mute);letter-spacing:1px}
.div:before,.div:after{content:"";flex:1;height:1px;background:var(--line)}
.run{display:flex;gap:10px}
.rail{flex:none;width:3px;border-radius:2px;background:var(--c)}
.rbody{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.rhead{display:flex;align-items:center;gap:6px;font-size:14px;flex-wrap:wrap}
.rhead b{color:var(--c)}
.rhead .t{font-size:12px;color:var(--mute)}
.ln{font-size:var(--fs);line-height:1.4;overflow-wrap:anywhere;white-space:pre-wrap}
.ln.emote{font-style:italic;color:var(--soft)}
.pfn{color:var(--finder)}
.pf{color:var(--soft)}
.tellc .ln{color:#ffa8dc;color:color-mix(in srgb,var(--tell) 72%,#fff)}
.tellc .ln .st{color:var(--mute)}
.ln .st{font-size:12px;color:var(--mute);margin-left:6px;white-space:nowrap}
.ln .st.bad{color:var(--bad)}
.failbox{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--badbg);border:1px solid var(--badedge);border-radius:8px;padding:6px 10px;font-size:13px;color:var(--bad);margin-top:4px}
.failbox button{color:var(--gold);font-weight:700}
.note{font-size:13px;color:var(--mute);padding-left:13px;border-left:3px solid var(--line)}
.callp{display:inline-flex;align-items:center;font-size:11px;font-weight:700;letter-spacing:.6px;color:var(--vent);background:#2b2210;border:1px solid #5a4620;border-radius:6px;padding:0 6px;height:18px;margin:0 3px 2px 0;vertical-align:1px;white-space:nowrap}
.burst{display:flex;flex-wrap:wrap;align-items:center;margin-top:2px}
.burst .lbl{font-size:12px;color:var(--mute);margin-right:6px}
.top .big::before{content:"";display:inline-block;width:.9em;height:.9em;margin-right:.3em;vertical-align:-.08em;background:url(/icons/pearl-96.png) center/contain no-repeat}
a.item{color:inherit;text-decoration:underline;text-decoration-color:rgba(255,255,255,.35);text-underline-offset:3px}
[data-who],[data-reply],[data-focus]{cursor:pointer;-webkit-tap-highlight-color:transparent}
.rhead .chico{display:flex;align-items:center;padding:4px 4px 4px 0;margin:-4px 0}
.rhead .who{display:flex;align-items:center}
@keyframes picked{0%{background:color-mix(in srgb,var(--c) 26%,transparent)}100%{background:transparent}}
.picked{animation:picked .7s ease-out}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.12)}100%{transform:scale(1)}}
.tgt.bump{animation:bump .35s ease-out}
a.url{color:#7fb2ff;background:#18254d;border-radius:6px;padding:0 6px;text-decoration:none;white-space:nowrap}
/* compact */
.cl{display:flex;gap:8px;align-items:flex-start}
.cl .rail{align-self:stretch}
.cl .t{flex:none;color:var(--mute);font-size:11.5px;padding-top:3px;width:36px;white-space:nowrap}
.clock-12 .cl .t{width:46px}
.ap{font-size:.74em;margin-left:2px;letter-spacing:.3px}
.t,.vt{white-space:nowrap}
.cl .ln{flex:1}
.cl .ln b{color:var(--c)}
.cl svg.i{vertical-align:-1px;margin-right:5px}
/* thread */
.run.mine{justify-content:flex-end}
.run.mine .rbody{max-width:84%;align-items:flex-end;flex:none}
.run.mine .rhead{justify-content:flex-end}
.run.mine .ln{text-align:right}
.jump{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:var(--gold);color:var(--ink);font-weight:700;font-size:13px;border-radius:999px;padding:6px 14px;box-shadow:0 4px 14px rgba(0,0,0,.5);display:none}
.jump.show{display:block}

/* composer */
.comp{display:flex;align-items:center;gap:8px;padding:10px 12px 10px;border-top:1px solid var(--line);background:var(--bg)}
.tgt{flex:none;display:flex;align-items:center;gap:6px;padding:8px 10px;border:1px solid var(--edge2);border-radius:999px;font-size:14px;background:#121a3a;max-width:130px;white-space:nowrap;overflow:hidden}
.tgt.tell{border-color:#7a4a96;background:#2a1a3a}
.tgt.cmd{border-color:var(--gold);background:#1a1730}
.tgt .car{color:var(--mute);font-size:11px}
.comp input{flex:1;min-width:0;font-size:16px;padding:10px 14px;border:1px solid var(--edge);border-radius:999px;background:var(--pane);color:var(--text);outline:none;-webkit-appearance:none}
.comp input:focus{border-color:var(--gold)}
.comp input.mono{font-family:var(--mono);font-size:16px;border-radius:10px}
.send{flex:none;width:40px;height:40px;border-radius:50%;background:#3a3f5c;display:flex;align-items:center;justify-content:center}
.send.on{background:var(--gold)}
.comp.dis{opacity:.5;pointer-events:none}
.emob{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--edge2);color:var(--soft);font:700 13px var(--mono)}
.emob.on{border-color:var(--gold);color:var(--gold)}
.emostrip{display:flex;gap:6px;overflow-x:auto;padding:8px 12px 2px;background:var(--bg);border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
.emostrip[hidden]{display:none}
.emostrip button{flex:none;padding:7px 12px;border:1px solid var(--edge2);border-radius:999px;color:var(--text);font:600 14px var(--mono)}
.comp.chat{position:relative;padding-top:22px}
.left{position:absolute;top:4px;right:64px;font-size:11.5px;color:var(--mute);font-variant-numeric:tabular-nums;letter-spacing:.3px}
.left.near{color:var(--gold)}
.left.over{color:var(--bad);font-weight:700}
.send.blocked{background:#3a3f5c;opacity:.5}

/* tab bar */
.tabbar{position:absolute;left:0;right:0;bottom:0;z-index:15;display:flex;border-top:1px solid var(--line);background:var(--bg);padding:8px 8px calc(10px + var(--safe-b))}
.tabbar button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--mute);position:relative}
.tabbar button.on{color:var(--gold)}
.tabbar .bdg{position:absolute;top:-4px;left:calc(50% + 6px);min-width:18px;height:18px;border-radius:9px;background:var(--gold);color:var(--ink);font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 5px}
body.typing .tabbar{display:none}
.tabbar .bdg[hidden]{display:none}

/* banners and lists */
.banner{margin:8px 12px 4px;padding:10px 14px;border-radius:12px;font-size:13.5px;line-height:1.45}
.banner.bad{background:var(--badbg);border:1px solid var(--badedge);color:#ffd0d0}
.banner.info{background:#14193a;border:1px solid var(--edge);color:var(--soft)}
.banner b{display:block;margin-bottom:2px}
.code{font-family:var(--mono);color:var(--gold)}
.list{flex:1;min-height:0;overflow-y:auto;padding:0 18px 12px}
.sect{padding:16px 0 6px;font-family:var(--serif);font-weight:600;font-size:13px;letter-spacing:1.2px;color:var(--gold)}
.lrow{display:flex;gap:14px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);width:100%;text-align:left}
.av{flex:none;width:46px;height:46px;border-radius:50%;background:#2a1a3a;border:2px solid var(--tell);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px;color:var(--tell)}
.lmain{flex:1;min-width:0}
.ltop{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.ltop b{font-size:17px}
.ltop span{font-size:13px;color:var(--mute);flex:none}
.lsub{font-size:14px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lsub.bad{color:var(--bad)}
.tag{font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--mute);border:1px solid var(--edge);border-radius:6px;padding:0 5px;margin-left:8px;vertical-align:2px}
.cnt{flex:none;min-width:22px;height:22px;border-radius:11px;background:var(--gold);color:var(--ink);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
.btnline{display:inline-flex;align-items:center;gap:8px;padding:10px 16px;border:1px solid var(--gold);border-radius:999px;color:var(--gold);font-weight:700;font-size:14px}
.center{text-align:center;padding:12px}

/* ventures */
.vcard{border-radius:16px;background:#1a1730;border:1px solid #5a4620;padding:16px;display:flex;flex-direction:column;gap:12px}
.vteaser{font-size:15px;color:var(--soft);line-height:1.4;font-style:italic}
.vzone{display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:12px;background:#241f3d}
.vgrid{flex:none;width:52px;height:52px;border-radius:12px;background:var(--vent);color:var(--ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px}
.vrow{display:flex;gap:10px;align-items:baseline;font-size:14.5px;padding:3px 0}
.vrow .vm{flex:1;min-width:0}
.vrow .vpct{margin-right:8px}
.vt{flex:none;font-size:12.5px;color:var(--mute);font-weight:400}
.acard{border-radius:14px;background:var(--raise);padding:11px 14px 12px;display:flex;flex-direction:column;gap:5px;margin-bottom:8px}
.ah{display:flex;align-items:center;gap:8px;min-height:20px}
.ah .al{flex:1;min-width:0;display:flex;align-items:center;gap:7px;font-size:14px;color:var(--c)}
.ah .al b{font-weight:700;letter-spacing:.2px}
.ax{flex:none;color:var(--mute);font-size:20px;line-height:1;padding:0 2px 0 8px;margin:-4px -4px -4px 0}
.abody{font-size:15px}
.vpct{flex:none;min-width:44px;font-weight:700;color:var(--vent)}
.vgrid.sm{width:auto;height:auto;padding:1px 6px;font-size:12px}
.empty.sm{padding:6px 2px 10px;font-size:13.5px;text-align:left}
#alerts .sect{margin-top:6px}
.vcard{margin-bottom:10px}
.vstatus{padding:10px 14px;border-radius:12px;background:#14193a;display:flex;gap:10px;align-items:center;font-size:14px;color:var(--soft);margin-top:10px}

/* settings */
.srow{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.srow .m{flex:1;min-width:0}
.srow .m div{font-size:15.5px}
.srow .m small{display:block;font-size:12.5px;color:var(--mute);margin-top:1px;line-height:1.35}
.srow.col{flex-direction:column;align-items:stretch;gap:10px;padding-bottom:14px}
.field{box-sizing:border-box;width:100%;padding:12px 16px;border:1px solid var(--edge);border-radius:12px;background:var(--pane);color:var(--text);font-size:16px;font-family:inherit;outline:none}
.field:focus{border-color:var(--gold)}
.tog{flex:none;width:46px;height:28px;border-radius:14px;background:var(--edge);position:relative;transition:background .15s}
.tog:after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:#2b8a46}
.tog.on:after{left:21px}
.segs{flex:none;display:flex;border:1px solid var(--edge);border-radius:9px;overflow:hidden}
.segs button{padding:6px 10px;font-size:12.5px;color:var(--mute)}
.segs button.on{background:var(--gold);color:var(--ink);font-weight:700}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px;background:var(--c)}
.fixed{font-size:13px;color:var(--mute)}
/* tap-to-act text buttons get an oval outline so they don't read as links */
.linkbtn,.dangerbtn{font-size:13px;font-weight:600;line-height:1;padding:7px 13px;border:1px solid;border-radius:999px;white-space:nowrap;vertical-align:middle}
.linkbtn{color:var(--gold);border-color:color-mix(in srgb,var(--gold) 65%,transparent)}
.dangerbtn{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 65%,transparent)}
.banner.dis{display:flex;align-items:center;gap:10px}
.banner.dis .bt{flex:1;min-width:0}
.banner.dis .ax{margin:0;padding:2px 4px 2px 8px}
.banner .linkbtn{margin-left:6px}
.cd{flex:none;margin-left:8px;padding:2px 9px;border:1px solid color-mix(in srgb,var(--vent) 60%,transparent);border-radius:999px;color:var(--vent);font:700 12px var(--mono);white-space:nowrap}
.vm .cd{font-size:11px;padding:1px 7px;margin-left:6px;vertical-align:1px}
.vstatus span{flex:1}
.vstatus .ax{margin:0}
/* colors */
.swatch{flex:none;width:44px;height:30px;border-radius:8px;border:1px solid var(--edge2);padding:0;background:none;overflow:hidden;-webkit-appearance:none;appearance:none}
.swatch::-webkit-color-swatch-wrapper{padding:0}
.swatch::-webkit-color-swatch{border:0;border-radius:7px}
.swatch::-moz-color-swatch{border:0;border-radius:7px}
/* emotes */
.emhead{display:flex;align-items:center;gap:10px;padding:18px 0 8px;font-family:var(--serif);font-weight:600;font-size:13px;letter-spacing:1.4px;color:var(--gold)}
.emhead::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--edge),transparent)}
.emhead i{width:8px;height:8px;border-radius:50%;background:var(--cc);box-shadow:0 0 8px var(--cc)}
.emtiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.emtiles.jobs{grid-template-columns:repeat(6,1fr);gap:6px}
.emtiles button{position:relative;height:46px;padding:0 8px 0 12px;text-align:left;border-radius:12px;border:1px solid var(--edge);
  background:linear-gradient(180deg,#1a2352,#111839);box-shadow:inset 0 1px 0 rgba(255,255,255,.06);font-size:15px;color:var(--text);overflow:hidden;white-space:nowrap;text-overflow:ellipsis;transition:transform .08s}
.emtiles button::before{content:"";position:absolute;left:0;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--cc)}
.emtiles button:active{transform:scale(.96);border-color:var(--cc)}
.emtiles.jobs button{height:40px;padding:0;text-align:center;font-size:13px;font-weight:700;letter-spacing:.5px;color:var(--cc);border-radius:10px}
.emtiles.jobs button::before{display:none}
.emtiles button.sent{border-color:var(--ok);box-shadow:0 0 0 1px var(--ok),0 0 14px rgba(126,224,143,.35);color:var(--ok)}
.emrecent{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none}
.emrecent::-webkit-scrollbar{display:none}
.emrecent button{flex:none;height:40px;padding:0 14px;border-radius:999px;border:1px solid var(--edge2);background:var(--chip);font-size:14.5px;color:var(--text)}
.emrecent button.sent{border-color:var(--ok);color:var(--ok)}
body.skin-classic .emtiles button,body.skin-classic .emrecent button{border-radius:6px;border:1px solid rgba(232,238,255,.7);
  background:linear-gradient(180deg,rgba(64,88,178,.95),rgba(24,36,100,.97));box-shadow:inset 0 0 0 1px rgba(8,12,40,.9),inset 0 1px 0 rgba(255,255,255,.3);text-shadow:1px 1px 0 #000}
body.skin-onyx .emtiles button{background:#0c0c0e;border-color:#2a2a30;box-shadow:none}
.emseg{margin:8px 18px 2px}
#qrbox{background:#fff;border-radius:12px;padding:8px;width:220px;margin:10px auto}
.subsect{padding:14px 0 2px;font-size:13px;color:var(--mute);letter-spacing:.3px}
.foot{font-size:12px;color:var(--mute);text-align:center;padding:18px 0 30px}

/* command */
.cmdlog .cl2{display:flex;gap:8px;font-family:var(--mono);font-size:13px;line-height:1.4}
.cmdlog .cl2 .t{flex:none;color:var(--mute)}
.cmdlog .cl2.sent span:last-child{color:var(--soft)}
.cmdlog .cl2.reply span:last-child{color:var(--ok)}
.cmdlog .cl2.bad span:last-child{color:var(--bad)}
.cmdlog .cl2.wait span:last-child{color:var(--mute)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 12px 2px;border-top:1px solid var(--line);scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;padding:7px 12px;border:1px solid #5a4620;border-radius:999px;font-size:13px;color:var(--gold);background:#1a1730;font-family:var(--mono);white-space:nowrap}
.chips button.all{border:1px dashed var(--edge2);color:var(--mute);font-family:var(--sans);background:none}
.crow{display:flex;align-items:center;gap:12px;padding:9px 0;border-bottom:1px solid var(--line)}
.crow .m{flex:1;min-width:0;text-align:left}
.crow .m div{font-family:var(--mono);font-size:15px;color:var(--gold)}
.crow .m small{display:block;font-size:12.5px;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctag{font-family:var(--sans);font-size:10px;font-weight:700;letter-spacing:.5px;color:var(--vent);border:1px solid #5a4620;border-radius:6px;padding:0 5px;margin-left:8px;vertical-align:2px}
.search{margin:8px 18px 0;padding:10px 14px;border:1px solid var(--edge);border-radius:999px;background:var(--pane);color:var(--text);font-size:16px;outline:none;width:calc(100% - 36px)}
.starb{flex:none;width:36px;height:36px;display:flex;align-items:center;justify-content:center}

/* sheet */
#scrim{position:absolute;inset:0;background:rgba(0,0,0,.45);z-index:60;display:none}
#scrim.on{display:block}
#sheet{position:absolute;left:0;right:0;bottom:0;z-index:61;background:var(--raise);border-top:1px solid var(--edge2);border-radius:20px 20px 0 0;padding:10px 14px calc(18px + var(--safe-b));box-shadow:0 -12px 30px rgba(0,0,0,.5);transform:translateY(105%);transition:transform .2s ease;max-height:85%;overflow-y:auto}
#sheet.on{transform:none}
.grab{width:40px;height:4px;border-radius:2px;background:var(--edge2);margin:0 auto 10px}
.shead{display:flex;align-items:center;justify-content:space-between;padding:0 6px 8px}
.shead .sect{padding:0}
.opt{display:flex;align-items:center;gap:14px;padding:10px 12px;border-radius:12px;border:1px solid transparent;width:100%;text-align:left}
.opt.sel{border-color:var(--gold);background:var(--chip)}
.opt .oc{flex:none;width:40px;height:40px;border-radius:50%;background:#16204a;border:2px solid var(--c);display:flex;align-items:center;justify-content:center}
.opt b{font-size:16px;display:block}
.opt small{font-size:12px;color:var(--mute)}
.sfield{display:block;font-size:11px;color:var(--mute);padding:0 2px}
.sinput{width:100%;margin:4px 0 8px;padding:10px 14px;border:1px solid var(--edge);border-radius:10px;background:var(--pane);color:var(--text);font-size:16px;outline:none}
.sbtns{display:flex;gap:10px;justify-content:flex-end;padding-top:10px}
.sbtns button{padding:9px 16px;border-radius:999px;font-weight:700;font-size:14px}
.sbtns .pri{background:var(--gold);color:var(--ink)}
.sbtns .sec{border:1px solid var(--edge2);color:var(--soft)}
.sbtns .del{color:var(--bad);margin-right:auto}
.sfoot{padding:10px 6px 0;font-size:12.5px;color:var(--mute);line-height:1.45}

/* ============ Skins (look only; nothing here changes what is read or sent) ============ */
/* Fonts */
body.font-classic{--sans:'Trebuchet MS','Verdana','Segoe UI',system-ui,sans-serif}

/* Classic: the blue game-window look. Original CSS, no game art. */
body.skin-classic{--bg:#060a1c;--pane:#16225a;--raise:#141f55;--chip:#22327a;--line:#2b3c86;--edge:#6676b8;--edge2:#c9d3f5;
  --text:#f6f8ff;--soft:#e2e8ff;--mute:#aab6de;--gold:#f3e6a6;--ink:#0d1336;--serif:var(--sans)}
body.skin-classic .win,
body.skin-classic .pane,
body.skin-classic #sheet,
body.skin-classic .vcard,
body.skin-classic .acard,
body.skin-classic .banner.info{
  background:linear-gradient(180deg,rgba(64,88,178,.94) 0%,rgba(30,44,118,.95) 38%,rgba(17,26,78,.97) 100%);
  border:1.5px solid rgba(236,240,255,.85);border-radius:11px;
  box-shadow:inset 0 0 0 1.5px rgba(6,10,36,.95),inset 0 0 0 2.5px rgba(150,170,235,.35),inset 0 2px 0 rgba(255,255,255,.25),0 3px 10px rgba(0,0,0,.55)}
body.skin-classic #sheet{border-radius:14px 14px 0 0;background:linear-gradient(180deg,#4058b2 0%,#1e2c76 38%,#111a4e 100%)}
body.skin-classic .top,body.skin-classic .bar{margin:8px 8px 4px;padding:8px 12px;border-radius:10px;border:1.5px solid #e9d996;
  background:linear-gradient(180deg,#3a4fa6 0%,#1d2a72 55%,#121a52 100%);
  box-shadow:inset 0 0 0 1.5px rgba(6,10,36,.95),inset 0 2px 0 rgba(255,255,255,.22),0 2px 8px rgba(0,0,0,.5)}
body.skin-classic .top .big{font-size:22px;color:var(--gold);text-shadow:1px 1px 0 #000,0 0 6px rgba(243,230,166,.25)}
body.skin-classic .bar .mid b,body.skin-classic .bar .back{color:var(--gold)}
body.skin-classic .bar .mid small{color:var(--soft)}
#cursor{position:fixed;z-index:999;width:0;height:0;border-left:11px solid var(--gold);border-top:7px solid transparent;border-bottom:7px solid transparent;
  filter:drop-shadow(1px 1px 0 #000) drop-shadow(0 0 2px rgba(0,0,0,.8));pointer-events:none;opacity:0;transition:opacity .25s}
#cursor.show{opacity:1;transition:none}
body.skin-classic .ln,body.skin-classic .rhead,body.skin-classic .cl,body.skin-classic .big,body.skin-classic .bar,
body.skin-classic .lrow,body.skin-classic .srow,body.skin-classic .opt,body.skin-classic .vcard,body.skin-classic .acard{text-shadow:1px 1px 0 rgba(0,0,0,.9)}
body.skin-classic .big{font-weight:700;letter-spacing:.3px}
body.skin-classic .sect{letter-spacing:1.5px;color:var(--gold)}
body.skin-classic .rail{width:2px}
body.skin-classic .comp input{border-radius:4px;background:linear-gradient(180deg,#0c1440,#152062);border-color:rgba(220,228,255,.6)}
body.skin-classic .tgt,body.skin-classic .chipb,body.skin-classic .seg,body.skin-classic .segs,body.skin-classic .pencil{border-radius:4px}
body.skin-classic .chipb.on,body.skin-classic .opt.sel{background:linear-gradient(180deg,#3b55b8,#22327a);border-color:rgba(240,244,255,.85)}
body.skin-classic .seg button.on,body.skin-classic .segs button.on{background:linear-gradient(180deg,#f6ecbd,#d9c47a);color:#1b1a0e}
body.skin-classic .opt.sel::before{content:"";width:0;height:0;border-left:7px solid #fff;border-top:5px solid transparent;border-bottom:5px solid transparent;margin-right:2px;filter:drop-shadow(1px 1px 0 #000)}
body.skin-classic .tabbar{background:linear-gradient(180deg,#1f2d72,#0b1236);border-top:1px solid rgba(232,238,255,.6)}
body.skin-classic .send.on{background:linear-gradient(180deg,#f6ecbd,#d9c47a)}
body.skin-classic .pill-on{border-radius:4px}

/* Onyx: plain black like the in-game log, more lines on screen. */
body.skin-onyx{--bg:#000;--pane:#000;--raise:#0b0b0f;--chip:#141418;--line:#1c1c22;--edge:#2c2c36;--edge2:#3a3a46;
  --text:#f2f2f2;--soft:#d6d6d6;--mute:#8a8a96;--gold:#e9d27a;--ink:#111;--serif:var(--sans)}
body.skin-onyx .pane{border-radius:0;border-color:#26262e;box-shadow:none}
body.skin-onyx .rail{display:none}
body.skin-onyx .run,body.skin-onyx .cl{gap:6px}
body.skin-onyx .pane .inner{gap:7px}
body.skin-onyx.compact .pane .inner{gap:2px}
body.skin-onyx .ln{text-shadow:1px 1px 0 #000}
body.skin-onyx .big{font-weight:700;letter-spacing:.3px}

#toast{position:absolute;left:16px;right:16px;bottom:calc(90px + var(--safe-b));z-index:70;background:#241f3d;border:1px solid #5a4620;color:var(--text);border-radius:12px;padding:10px 14px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.on{opacity:1}
</style>

  <!-- settings -->
  <div class="screen overlay" id="scr-settings">
    <div class="bar"><button class="back" data-back><svg class="i" width="22" height="22"><use href="#i-back"/></svg>Back</button><div class="mid"><b style="font-family:var(--serif);font-size:19px">Settings</b></div><div class="end"></div></div>
    <div class="list" id="settings"></div>
  </div>

  <nav class="tabbar" id="tabbar">
    <button data-tab="chat" class="on"><svg class="i" width="22" height="22"><use href="#i-ls1"/></svg>Chat</button>
    <button data-tab="tells"><svg class="i" width="22" height="22"><use href="#i-tell"/></svg>Tells<span class="bdg" id="bdg-tells" hidden></span></button>
    <button data-tab="cmds"><svg class="i" width="22" height="22"><use href="#i-cmd"/></svg>Commands</button>
    <button data-tab="alerts"><svg class="i" width="22" height="22"><use href="#i-bell"/></svg>Alerts<span class="bdg" id="bdg-alerts" hidden></span></button>
  </nav>

  <div id="scrim"></div>
  <div id="sheet"></div>
  <div id="toast"></div>
</div>

<script>
(function () {
"use strict";

// ------------------------------------------------------------------------------------------
// Basics
// ------------------------------------------------------------------------------------------
var TOKEN = new URLSearchParams(location.search).get("t") || "";
var CH = {
  ls1:   {label: "LS1",    full: "Linkshell 1", icon: "ls1",   c: "var(--ls1)",   send: "/l"},
  ls2:   {label: "LS2",    full: "Linkshell 2", icon: "ls2",   c: "var(--ls2)",   send: "/l2"},
  party: {label: "Party",  full: "Party",       icon: "party", c: "var(--party)", send: "/p"},
  tell:  {label: "Tells",  full: "Tell",        icon: "tell",  c: "var(--tell)",  send: "/t"},
  say:   {label: "Say",    full: "Say",         icon: "say",   c: "var(--say)",   send: "/s", sub: "Nearby"},
  shout: {label: "Shout",  full: "Shout",       icon: "shout", c: "var(--shout)", send: "/sh", sub: "Local area"},
  unity: {label: "Unity",  full: "Unity",       icon: "unity", c: "var(--unity)"},
  yell:  {label: "Yell",   full: "Yell",        icon: "yell",  c: "var(--yell)",  sub: "Trade spam. Read only."},
  emote: {label: "Emotes", full: "Emotes",      icon: "emote", c: "var(--emote)"},
  finder:{label: "Finder", full: "Party Finder", icon: "finder", c: "var(--finder)", sub: "Party Finder ads. Read only."}
};
var CHAT_CH = ["ls1", "ls2", "party", "tell", "say", "shout", "unity", "yell", "emote", "finder"];
var SENDABLE = ["ls1", "ls2", "party", "tell", "say", "shout"];
var MAX_VIEWS = 5;

function esc(s) {
  return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) {
    return {"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c];
  });
}
function $(id) { return document.getElementById(id); }
function ico(name, size, style) {
  return '<svg class="i" width="' + (size || 14) + '" height="' + (size || 14) + '"' + (style ? ' style="' + style + '"' : "") + '><use href="#i-' + name + '"/></svg>';
}
function hhmm(ts) {
  var d = new Date(ts * 1000), h = d.getHours(), mm = String(d.getMinutes()).padStart(2, "0");
  if (S.clock === "24") return String(h).padStart(2, "0") + ":" + mm;
  return ((h + 11) % 12 + 1) + ":" + mm + '<small class="ap">' + (h < 12 ? "AM" : "PM") + "</small>";
}
function dayLabel(ts) {
  var d = new Date(ts * 1000), now = new Date();
  if (d.toDateString() === now.toDateString()) return "Today " + hhmm(ts);
  var y = new Date(now); y.setDate(now.getDate() - 1);
  if (d.toDateString() === y.toDateString()) return "Yesterday " + hhmm(ts);
  return d.toLocaleDateString(undefined, {month: "short", day: "numeric"}) + " " + hhmm(ts);
}
function nowSec() { return Math.floor(Date.now() / 1000); }
var toastTimer = null;
function toast(text) {
  var t = $("toast");
  t.textContent = text;
  t.classList.add("on");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { t.classList.remove("on"); }, 3200);
}

// ------------------------------------------------------------------------------------------
// Settings (per device). Storage can be blocked, so everything is wrapped.
// ------------------------------------------------------------------------------------------
var DEFAULTS = {
  density: "comfortable", size: "M", calls: "highlight", tipSeen: false, tellsBan: false, hidden: [],
  clock: "12", watch: "", bazaar: false, cseg: "emote", motdMin: false, seenAlerts: 0, scrollback: 1,
  master: {ls1: true, ls2: true, party: true, tell: true, say: true, shout: true, unity: true, yell: false, emote: true, finder: true},
  views: [
    {id: "all", name: "All", ch: {ls1: true, ls2: true, party: true, tell: true, say: true, shout: true, unity: false, yell: false, emote: true, finder: true}},
    {id: "v1", name: "Linkshells", ch: {ls1: true, ls2: true}},
    {id: "v2", name: "Party & tells", ch: {party: true, tell: true}}
  ],
  view: "all",
  target: {ch: "ls1", peer: ""},
  favs: ["!mog", "!points", "!dailies"],
  colors: {}, emoteMode: "", recentEmotes: [], skin: "midnight", font: "readable",
  read: {}
};
var freshLocal = false;
var S = load();
function load() {
  var s = null;
  try { s = JSON.parse(localStorage.getItem("pcxi") || "null"); } catch (e) { s = null; }
  freshLocal = !s;
  return merged(s);
}
function merged(s) {
  var out = JSON.parse(JSON.stringify(DEFAULTS));
  if (s && typeof s === "object") {
    for (var k in out) if (s[k] !== undefined) out[k] = s[k];
    out.master = Object.assign({}, DEFAULTS.master, s.master || {});
  }
  if (!Array.isArray(out.views) || !out.views.length || out.views[0].id !== "all") out.views = DEFAULTS.views;
  if (out.views[0].ch && out.views[0].ch.finder === undefined) out.views[0].ch.finder = true;
  return out;
}
var saveTimer = null, pushTimer = null, prefsReady = false;
function save() {
  S.savedAt = Date.now();
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function () {
    try { localStorage.setItem("pcxi", JSON.stringify(S)); } catch (e) { /* storage blocked: settings last until reload */ }
  }, 150);
  // Keep a copy on the bridge, so a new Home Screen shortcut or another phone gets them back.
  if (!prefsReady) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(function () { api("/api/prefs", {prefs: S}).catch(function () {}); }, 2500);
}
function adopt(obj) {
  S = merged(obj);
  try { localStorage.setItem("pcxi", JSON.stringify(S)); } catch (e) {}
  applyLook(); setWatch(); buildComposers(); seenCount = {}; render();
}
function syncPrefs() {
  getJSON("/api/prefs").then(function (j) {
    var b = j && j.prefs;
    prefsReady = true;
    // A phone with nothing saved yet always takes the bridge copy.
    if (b && (freshLocal || (b.savedAt || 0) > (S.savedAt || 0))) adopt(b);
    else if (!b || (S.savedAt || 0) > (b.savedAt || 0)) save();
  }).catch(function () { prefsReady = true; });
}
function exportPrefs() {
  var blob = new Blob([JSON.stringify(S, null, 1)], {type: "application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = "phonechatXI-settings.json";
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
}
function importPrefs(file) {
  var r = new FileReader();
  r.onload = function () {
    try {
      var obj = JSON.parse(r.result);
      if (!obj || typeof obj !== "object" || !obj.views) throw new Error("bad");
      obj.savedAt = Date.now();
      adopt(obj); save(); toast("Settings imported.");
    } catch (e) { toast("That file isn't a phonechatXI settings file."); }
  };
  r.readAsText(file);
}
var DEFAULT_COLORS = {ls1: "#7ee08f", ls2: "#4fd6c8", party: "#7fb2ff", tell: "#ff8fd0", say: "#dfe5f5", shout: "#ff9a5c", unity: "#e8c35c", yell: "#c98a5c", emote: "#b9a6ff", finder: "#8fd0ff"};
function colorOf(c) { return (S.colors && S.colors[c]) || DEFAULT_COLORS[c]; }
function applyColors() {
  CHAT_CH.forEach(function (c) { document.documentElement.style.setProperty("--" + c, colorOf(c)); });
}
var cursorEl = null, cursorT = 0;
function cursorAt(el) {
  if (!document.body.classList.contains("skin-classic")) return;
  if (!cursorEl) { cursorEl = document.createElement("div"); cursorEl.id = "cursor"; document.body.appendChild(cursorEl); }
  cursorFor = el;
  var r = el.getBoundingClientRect();
  cursorEl.style.left = Math.max(1, r.left - 13) + "px";
  cursorEl.style.top = (r.top + r.height / 2 - 7) + "px";
  cursorEl.classList.add("show");
  clearTimeout(cursorT);
  cursorT = setTimeout(function () { cursorEl.classList.remove("show"); }, 1200);
}
function cursorHide() { if (cursorEl) cursorEl.classList.remove("show"); }
var cursorFor = null;
document.addEventListener("click", function () {
  setTimeout(function () {
    if (!cursorFor || !cursorEl || !cursorEl.classList.contains("show")) return;
    var r = cursorFor.getBoundingClientRect(), hit = document.elementFromPoint(r.left + r.width / 2, r.top + r.height / 2);
    if (!r.width || !hit || !cursorFor.contains(hit)) cursorHide();
  }, 80);
}, true);
document.addEventListener("pointerdown", function (e) {
  var b = e.target.closest && e.target.closest("button,.chipb,.tgt,.lrow,.opt,a,[data-who]");
  if (b && !b.closest(".tabbar") && !b.classList.contains("opt")) cursorAt(b);
}, true);
document.addEventListener("scroll", cursorHide, true);
function applyLook() {
  applyColors();
  ["skin-midnight", "skin-classic", "skin-onyx", "font-readable", "font-classic"].forEach(function (c) { document.body.classList.remove(c); });
  if (S.font !== "classic") S.font = "readable";
  document.body.classList.add("skin-" + (S.skin || "midnight"), "font-" + S.font);
  document.body.classList.toggle("compact", S.density === "compact");
  document.body.classList.toggle("clock-12", S.clock !== "24");
  document.body.classList.remove("size-S", "size-M", "size-L");
  document.body.classList.add("size-" + S.size);
}

// ------------------------------------------------------------------------------------------
// Data from the bridge
// ------------------------------------------------------------------------------------------
var msgs = [];          // everything except acks, in id order
var byId = {};
var pend = {};          // pid -> local outgoing line waiting on the game
var pendOrder = [];
var cmdLog = [];
var lastCmdAt = 0;
var status = {char: "", save_tells: false, url: ""};
var connected = false, everConnected = false, lastBoot = null, offlineSince = Date.now(), linkDead = false;
var commands = {info: {}, action: {}};

function api(path, body) {
  return fetch(path, {
    method: "POST",
    headers: {"Content-Type": "application/json", "X-Token": TOKEN},
    body: JSON.stringify(body || {})
  }).then(function (r) {
    return r.json().catch(function () { return {ok: false, error: "Bridge error " + r.status}; }).then(function (j) { j._status = r.status; return j; });
  });
}
function getJSON(path) {
  return fetch(path + (path.indexOf("?") < 0 ? "?" : "&") + "t=" + encodeURIComponent(TOKEN), {headers: {"X-Token": TOKEN}})
    .then(function (r) { if (!r.ok) throw new Error(r.status); return r.json(); });
}
function refreshStatus() {
  getJSON("/api/status").then(function (j) { status = j; render(); }).catch(function () {});
}

var lsName = {}, lsMotd = {};
// Mentions: watched words from Settings, whole words, any case.
var watchRe = null, watchReG = null;
function setWatch() {
  var words = (S.watch || "").split(",").map(function (w) { return w.trim(); }).filter(function (w) { return w.length >= 2; });
  var src = words.map(function (w) { return w.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"); }).join("|");
  watchRe = words.length ? new RegExp("(^|[^A-Za-z0-9])(" + src + ")(?![A-Za-z0-9])", "i") : null;
  watchReG = words.length ? new RegExp("(^|[^A-Za-z0-9])(" + src + ")(?![A-Za-z0-9])", "gi") : null;
  msgs.forEach(function (m) { m._men = isMention(m); });
}
function isMention(m) {
  return !!watchRe && m.dir !== "out" && !m.pending && CHAT_CH.indexOf(m.ch) >= 0 && m.ch !== "finder" && watchRe.test(m.body || "");
}
function markWatch(h) {
  return h.split(/(<[^>]+>)/).map(function (part, i) {
    return i % 2 ? part : part.replace(watchReG, '$1<mark class="mw">$2</mark>');
  }).join("");
}
function onMsg(m) {
  if (m.ch === "_ack") { onAck(m); return; }
  if (m.ch === "motd") {
    lsMotd[m.name] = m.body;
    lsName[m.name] = m.body;
    schedule();
    return;
  }
  if (byId[m.id]) return;
  byId[m.id] = m;
  m._men = isMention(m);
  msgs.push(m);
  if (m.pid && pend[m.pid]) { delete pend[m.pid]; }
  if (lastCmdAt && Date.now() - lastCmdAt < 8000 && (m.ch === "system" || m.ch === "echo" || m.ch === "server")) {
    cmdLog.push({ts: m.ts, text: m.body, kind: "reply"});
  }
  if (msgs.length > 4000 * (S.scrollback || 1)) {
    var drop = msgs.splice(0, 500);
    drop.forEach(function (d) { delete byId[d.id]; });
  }
  schedule();
}
function onAck(a) {
  var p = pend[a.pid];
  if (a.pid && a.pid.charAt(0) === "c") {
    if (a.state === "failed") cmdLog.push({ts: a.ts, text: a.reason || "Could not send.", kind: "bad"});
    schedule();
    return;
  }
  if (!p) return;
  if (a.state === "sent") { p.state = "sent"; setTimeout(function () { if (pend[a.pid]) { delete pend[a.pid]; schedule(); } }, 4000); }
  else { p.state = a.state; p.reason = a.reason || ""; }
  schedule();
}

var es = null;
function connect() {
  if (es) { try { es.close(); } catch (e) {} }
  es = new EventSource("/events?t=" + encodeURIComponent(TOKEN));
  es.addEventListener("hello", function (ev) {
    var j = {};
    try { j = JSON.parse(ev.data); } catch (e) {}
    if (lastBoot !== null && j.boot !== lastBoot) { msgs = []; byId = {}; }
    lastBoot = j.boot;
    setConnected(true);
    refreshStatus();
  });
  es.onmessage = function (ev) {
    try { onMsg(JSON.parse(ev.data)); } catch (e) {}
  };
  es.onopen = function () { setConnected(true); };
  es.onerror = function () {
    setConnected(false);
    if (es.readyState !== 2) return;
    // A closed stream is either the bridge being off or this link being replaced. Ask which.
    fetch("/api/status?t=" + encodeURIComponent(TOKEN), {headers: {"X-Token": TOKEN}}).then(function (r) {
      if (r.status === 403) { linkDead = true; render(); return; }
      setTimeout(connect, 3000);
    }).catch(function () { setTimeout(connect, 3000); });
  };
}
function setConnected(on) {
  if (on === connected) return;
  connected = on;
  if (on) everConnected = true; else offlineSince = Date.now();
  render();
  if (!on) setTimeout(render, 3500);
}
document.addEventListener("visibilitychange", function () {
  if (document.visibilityState === "visible" && !linkDead && (!es || es.readyState !== 1)) connect();
});

// ------------------------------------------------------------------------------------------
// Message text: escape, calls, links
// ------------------------------------------------------------------------------------------
var URL_RE = /\b((?:https?:\/\/|www\.)[^\s<>"']+[^\s<>"'.,;:!?)\]])/gi;
var CALL_RE = /&lt;\s*call\s*(\d{1,2})\s*&gt;/gi;
function fmt(body) {
  var h = esc(body);
  if (S.calls !== "off") {
    h = h.replace(CALL_RE, function (all, n) { n = +n; return n >= 1 && n <= 25 ? '<span class="callp">CALL ' + n + "</span>" : all; });
  }
  h = h.replace(URL_RE, function (u) {
    var raw = u.replace(/&amp;/g, "&").replace(/&#39;/g, "'").replace(/&quot;/g, '"');
    var href = /^https?:/i.test(raw) ? raw : "https://" + raw;
    var dom = href.replace(/^https?:\/\//i, "").split(/[\/?#]/)[0];
    return '<a class="url" href="' + esc(href) + '" target="_blank" rel="noopener noreferrer">' + esc(dom) + " &#8599;</a>";
  });
  // {{Item}} = an auto-translated item: link it. {Phrase} = auto-translate phrase or zone: style only.
  h = h.replace(/\{\{([^{}<>\n]{1,40})\}\}/g, function (all, name) {
    var q = name.replace(/&amp;/g, "&").replace(/&#39;/g, "'").replace(/&quot;/g, '"').trim();
    if (!q) return all;
    return '<a class="item" href="https://www.bg-wiki.com/ffxi/Special:Search?search=' + encodeURIComponent(q) + '" target="_blank" rel="noopener noreferrer">{' + name + "}</a>";
  });
  h = h.replace(/\{([^{}<>\n]{1,60})\}/g, '<span class="at">{$1}</span>');
  if (watchRe) h = markWatch(h);
  return h;
}
function hasLink(m) { URL_RE.lastIndex = 0; return URL_RE.test(m.body || ""); }

// ------------------------------------------------------------------------------------------
// Which messages a screen shows
// ------------------------------------------------------------------------------------------
function curView() {
  for (var i = 0; i < S.views.length; i++) if (S.views[i].id === S.view) return S.views[i];
  S.view = "all";
  return S.views[0];
}
function shows(ch, view) { return !!(S.master[ch] && view.ch[ch]); }
function pendList(filter) {
  var out = [];
  pendOrder = pendOrder.filter(function (pid) { return pend[pid]; });
  pendOrder.forEach(function (pid) { var p = pend[pid]; if (filter(p)) out.push(p); });
  return out;
}
function chatItems() {
  var v = curView(), isAll = v.id === "all";
  var items = msgs.filter(function (m) {
    if (CHAT_CH.indexOf(m.ch) >= 0) return shows(m.ch, v);
    if (m.ch === "zone") return isAll;
    if (m.ch === "system") return isAll || v.ch.tell || v.ch.party;
    return false;
  });
  return items.concat(pendList(function (p) { return shows(p.ch, v); }));
}
var focus = {ch: "ls1", filter: "all"};
function focusItems() {
  var items = msgs.filter(function (m) {
    if (m.ch !== focus.ch) return false;
    if (focus.filter === "calls") return !!m.calls;
    if (focus.filter === "links") return hasLink(m);
    return true;
  });
  if (focus.filter === "all") items = items.concat(pendList(function (p) { return p.ch === focus.ch; }));
  return items;
}
var thread = {peer: ""};
function threadItems() {
  var key = thread.peer.toLowerCase();
  return msgs.filter(function (m) { return m.ch === "tell" && (m.name || "").toLowerCase() === key; })
    .concat(pendList(function (p) { return p.ch === "tell" && p.peer.toLowerCase() === key; }));
}

// ------------------------------------------------------------------------------------------
// Rendering the stream
// ------------------------------------------------------------------------------------------
function myName() { return status.char || "You"; }
function senderOf(m) {
  if (m.pending || (m.ch === "tell" && m.dir === "out")) return myName();
  return m.name || (m.dir === "out" ? myName() : "");
}

function stateHtml(m) {
  if (!m.pending) return "";
  if (m.state === "sending") return '<span class="st">sending&hellip;</span>';
  if (m.state === "sent") return '<span class="st">sent</span>';
  return "";
}
function failHtml(m) {
  if (!m.pending || (m.state !== "failed" && m.state !== "unconfirmed")) return "";
  var why = m.state === "failed" ? (m.reason || "Not delivered") : "The game didn't confirm this one";
  return '<div class="failbox"><span>' + esc(why) + '</span><button data-retry="' + esc(m.pid) + '">Retry</button></div>';
}
// Party Finder ads read like the game's: the poster's name stands out, the rest is italic.
function fmtFinder(body) {
  var mm = /^(\S+) (is looking for (?:members|a party)):?\s*([\s\S]*)$/.exec(body || "");
  if (!mm) return '<i class="pf">' + fmt(body) + "</i>";
  return '<b class="pfn">' + esc(mm[1]) + '</b> <i class="pf">' + esc(mm[2]) + ":</i> " + fmt(mm[3]);
}
function bodyHtml(m) { return m.ch === "finder" ? fmtFinder(m.body) : fmt(m.body); }
function bodyLine(m, ctx) {
  var b = bodyHtml(m);
  if (m.ch === "tell" && ctx !== "thread") {
    b = m.dir === "in" ? "&gt;&gt; " + b : "&gt;&gt;" + esc(m.pending ? m.peer : m.name) + " : " + b;
  }
  return '<div class="ln' + (m.ch === "emote" ? " emote" : "") + '">' + b + stateHtml(m) + "</div>" + failHtml(m);
}
function isCallOnly(m) { return false; }   // roll-call folding removed in 1.1

function blocks(items, ctx) {
  items = items.slice().sort(function (a, b) { return (a.ts - b.ts) || ((a.id || 1e12) - (b.id || 1e12)); });
  var out = [], last = null, prevTs = 0;
  for (var i = 0; i < items.length; i++) {
    var m = items[i];
    if (!prevTs || m.ts - prevTs > 1800) out.push({type: "div", html: dayLabel(m.ts)});
    prevTs = m.ts;
    if (m.ch === "zone") { out.push({type: "div", text: m.body}); last = null; continue; }
    if (m.ch === "system") { out.push({type: "note", m: m}); last = null; continue; }
    if (isCallOnly(m)) {
      var grp = [m], j = i + 1;
      while (j < items.length && isCallOnly(items[j]) && items[j].ch === m.ch && items[j].name === m.name && items[j].ts - grp[grp.length - 1].ts <= 10) { grp.push(items[j]); j++; }
      if (grp.length >= 3) { out.push({type: "burst", m: m, grp: grp}); i = j - 1; last = null; continue; }
    }
    var who = senderOf(m), dir = m.pending ? "out" : m.dir;
    if (ctx !== "compact" && last && last.ch === m.ch && last.who === who && last.dir === dir && m.ts - last.lastTs <= 120 && !m.calls && !last.call) {
      last.ms.push(m); last.lastTs = m.ts; continue;
    }
    last = {type: "run", ch: m.ch, who: who, dir: dir, ms: [m], lastTs: m.ts, call: !!(m.calls && S.calls !== "off")};
    out.push(last);
  }
  return out;
}
function runHead(b, ctx) {
  var m = b.ms[0], c = CH[b.ch] || {icon: "bell", c: "var(--sys)"};
  var extra = "";
  if (b.dir === "out") extra += " &middot; you";
  if (m.zone) extra += " &middot; " + esc(m.zone);
  if (m.saved && ctx === "thread") extra += " &middot; saved";
  var whoName = b.ch === "tell" ? (m.pending ? m.peer : m.name) : (b.dir === "out" || b.ch === "emote" ? "" : (m.name || ""));
  var nameTap = ' data-who="' + esc(whoName) + '" data-ch="' + b.ch + '"';
  if (ctx === "thread" && b.dir === "out") {

function tellPeers() {
  var map = {};

    if (!name) return;
    var k = name.toLowerCase();
    var p = map[k] || (map[k] = {name: name, last: null, unread: 0, saved: false, failed: false});
    if (!p.last || m.ts >= p.last.ts) { p.last = m; p.failed = isPend && (m.state === "failed"); }
    if (m.saved) p.saved = true;
    if (!isPend && m.dir === "in" && m.ts > (S.read[k] || 0)) p.unread++;
  }
  msgs.forEach(function (m) { if (m.ch === "tell") touch(m.name, m, false); });
  pendOrder.forEach(function (pid) { var p = pend[pid]; if (p && p.ch === "tell") touch(p.peer, p, true); });
  return Object.keys(map).map(function (k) { return map[k]; }).sort(function (a, b) { return b.last.ts - a.last.ts; });
}

    else if (m.ch === "venture" || m.ch === "server" || (S.bazaar && m.ch === "bazaar")) other = true;
  });
  var bd = $("bdg-alerts");
  bd.hidden = curTab === "alerts" || !(unseenMen || other);
  bd.textContent = unseenMen ? String(Math.min(unseenMen, 99)) : "!";
  if (curTab === "alerts") S.seenAlerts = nowSec();
}
function noticeKey(m) { return String(m.id || (m.ts + ":" + (m.body || "").slice(0, 40))); }
function renderMotd() {
  function strip(chs) {
    return chs.filter(function (c) { return lsMotd[c]; }).map(function (c) {
      return '<div class="motd' + (S.motdMin ? " min" : "") + '" style="--c:' + CH[c].c + '"><b>' + CH[c].label + '</b><span>' + fmt(lsMotd[c]) + '</span><button class="x" data-motd aria-label="' + (S.motdMin ? "Show all" : "Shrink") + '">' + (S.motdMin ? "&#9662;" : "&#9652;") + "</button></div>";
    }).join("");
  }
  var v = curView();
  $("motd-chat").innerHTML = curTab === "chat" ? strip(["ls1", "ls2"].filter(function (c) { return shows(c, v); })) : "";
  $("motd-focus").innerHTML = stack[stack.length - 1] === "focus" && (focus.ch === "ls1" || focus.ch === "ls2") ? strip([focus.ch]) : "";
}
document.addEventListener("click", function (e) {
  if (e.target.closest("[data-motd]")) { S.motdMin = !S.motdMin; save(); render(); }
  var dz = e.target.closest("[data-dismiss]");
  if (dz) {
    var keys = dz.dataset.dismiss === "*" ? msgs.filter(function (m) { return m.ch === "server" || m.ch === "system"; }).map(noticeKey) : dz.dataset.dismiss.split(";;");
    S.hidden = (S.hidden || []).concat(keys).slice(-300);   // only alert cards can be dismissed; nothing is deleted from chat
    save(); render();
  }
});

// ------------------------------------------------------------------------------------------
// Settings
// ------------------------------------------------------------------------------------------
function tog(on, key) { return '<button class="tog' + (on ? " on" : "") + '" data-set="' + key + '"></button>'; }
function segs(key, opts, cur) { return '<div class="segs">' + opts.map(function (o) { return '<button data-seg="' + key + '" data-val="' + o[0] + '"' + (o[0] === cur ? ' class="on"' : "") + ">" + o[1] + "</button>"; }).join("") + "</div>"; }
function srow(title, sub, right) { return '<div class="srow"><div class="m"><div>' + title + "</div>" + (sub ? "<small>" + sub + "</small>" : "") + "</div>" + right + "</div>"; }
var showQr = false;
function renderSettings() {
  var ae = document.activeElement;
  if (ae && ae.id === "watchin") return;          // don't redraw under the reader's thumb
  var link = location.origin + "/?t=" + encodeURIComponent(TOKEN);
  var h = '<div class="sect">CONNECTION</div>' +
    srow("Bridge", connected ? "Connected" + (status.version ? " &middot; " + esc(status.version) : "") + (status.char ? " &middot; " + esc(status.char) : "") : "Not connected", '<button class="linkbtn" data-act="qr">' + (showQr ? "Hide QR" : "Show QR") + "</button>") +
    (showQr ? '<div id="qrbox"></div><div class="sfoot" style="text-align:center;word-break:break-all">' + esc(link) + "</div>" : "") +
    srow("Start with the game", "Turn on in <span class=\"code\">/pchat config</span>.", "") +
    srow("New phone link", "In <span class=\"code\">/pchat config</span>, or type <span class=\"code\">/pchat newlink</span>.", "") +
    '<div class="sect">CHANNELS</div>' +
    CHAT_CH.map(function (c) { return srow('<span class="dot" style="--c:' + CH[c].c + '"></span>' + CH[c].full, c === "yell" ? "Trade spam. Read only." : (c === "shout" ? "Local area" : (c === "say" ? "Nearby" : (c === "finder" ? "Read only." : ""))), tog(S.master[c], "m." + c)); }).join("") +
    '<div class="sect">CALLS</div>' +
    srow("When a call comes in", "", segs("calls", [["off", "Off"], ["highlight", "Highlight"], ["badge", "Badge"]], S.calls)) +
    '<div class="sect">ALERTS</div>' +
    '<div class="srow col"><div class="m"><div>Words to watch</div><small>Marked in chat and listed in Alerts. Separate with commas.</small></div>' +
    '<input class="field" id="watchin" placeholder="Charta, Char" autocomplete="off" autocapitalize="off" spellcheck="false" value="' + esc(S.watch || "") + '"></div>' +
    srow("Bazaar visits", "Listed in Alerts when someone browses your bazaar.", tog(S.bazaar, "bazaar")) +
    '<div class="sect">PRIVACY</div>' +
    srow("Remember tells", "Last 50 lines per person, on the bridge. Nothing else is saved.", tog(status.save_tells, "save_tells")) +
    srow("Clear saved tells", "", '<button class="dangerbtn" data-act="clear">Clear</button>') +
    '<div class="sect">APPEARANCE</div>' +
    srow("Skin", "", segs("skin", [["midnight", "Midnight"], ["classic", "Classic"], ["onyx", "Onyx"]], S.skin || "midnight")) +
    srow("Font", "", segs("font", [["readable", "Readable"], ["classic", "Classic"]], S.font || "readable")) +
    srow("Density", "", segs("density", [["comfortable", "Comfortable"], ["compact", "Compact"]], S.density)) +
    srow("Text size", "", segs("size", [["S", "S"], ["M", "M"], ["L", "L"]], S.size)) +
    srow("Clock", "", segs("clock", [["12", "12-hour"], ["24", "24-hour"]], S.clock || "12")) +
    srow("Scrollback", "Lines kept per channel", segs("scrollback", [["1", "500"], ["2", "1,000"], ["4", "2,000"]], String(S.scrollback || 1))) +
    '<div class="subsect">Channel colors</div>' +
    CHAT_CH.map(function (c) { return srow(ico(CH[c].icon, 16, "margin-right:8px;vertical-align:-2px") + CH[c].full, "", '<input type="color" class="swatch" data-color="' + c + '" value="' + colorOf(c) + '" aria-label="' + CH[c].full + ' color">'); }).join("") +
    srow("Reset colors", "", '<button class="linkbtn" data-act="resetcolors">Reset</button>') +
    '<div class="sect">BACKUP</div>' +
    srow("Your settings", "Also saved on the bridge, so a new shortcut or phone picks them up.", '<button class="linkbtn" data-act="export">Export</button><button class="linkbtn" data-act="import" style="margin-left:8px">Import</button>') +
    '<input type="file" id="importin" accept="application/json,.json" hidden>' +
    '<div class="sect">ABOUT</div>' +
    srow("Version", esc(status.version || "Unknown") + " &middot; by Charta", "") +
    srow("Staff review", "1.0.0 reviewed by CatsEyeXI staff: T1, Sanctioned. Later versions are listed in the changelog.", "") +
    srow("What it sends", "Only what you tap: chat, emotes and CatsEye ! commands, one line per tap. Never game actions, never on its own.", "") +
    srow("On iPhone", "No tell notifications. It pauses when the phone locks and catches up when you come back.", "") +
    srow("Your data", "Stays on your home network. Only item links leave it, to BG-Wiki.", "") +
    '<div style="height:28px"></div>';
  $("settings").innerHTML = h;
  if (showQr && window.qrcode) {
    try { var q = qrcode(0, "M"); q.addData(link); q.make(); $("qrbox").innerHTML = q.createSvgTag({cellSize: 5, margin: 2, scalable: true}); } catch (e) {}
  }
}
function loadQr(cb) {
  if (window.qrcode) { cb(); return; }
  var s = document.createElement("script"); s.src = "/qr.js"; s.onload = cb; document.head.appendChild(s);
}
$("settings").addEventListener("change", function (e) {
  if (e.target.id === "importin") { if (e.target.files[0]) importPrefs(e.target.files[0]); return; }
  if (e.target.id !== "watchin") return;
  S.watch = e.target.value; save(); setWatch(); e.target.blur(); render();
});
$("settings").addEventListener("keydown", function (e) {
  if (e.target.id === "watchin" && e.key === "Enter") e.target.blur();
});
$("settings").addEventListener("input", function (e) {
  // Save the watch words as you type: iOS doesn't fire "change" when you leave the box by tapping Back.
  if (e.target.id === "watchin") { S.watch = e.target.value; save(); setWatch(); schedule(); return; }
  var c = e.target.closest("[data-color]");
  if (!c) return;
  S.colors = S.colors || {};
  S.colors[c.dataset.color] = c.value;
  applyColors(); save(); schedule();
});
$("settings").addEventListener("click", function (e) {
  var t = e.target.closest("[data-set]");
  if (t) {
    var k = t.dataset.set;
    if (k.indexOf("m.") === 0) { S.master[k.slice(2)] = !S.master[k.slice(2)]; }
    else if (k === "bazaar") { S.bazaar = !S.bazaar; }
    else if (k === "save_tells") {
      api("/api/settings", {save_tells: !status.save_tells}).then(function (j) { if (j.ok) { status.save_tells = j.save_tells; render(); } else toast(j.error || "Could not change that."); });
      return;
    }
    save(); render(); return;
  }
  var s = e.target.closest("[data-seg]");
  if (s) {
    var key = s.dataset.seg, val = s.dataset.val;
    if (key === "scrollback") {
      S.scrollback = +val;
      api("/api/settings", {scrollback: +val}).then(function (j) { if (!j.ok) toast(j.error || "Could not change that."); });
    } else S[key] = val;
    save(); applyLook(); seenCount = {}; render(); return;
  }
  var a = e.target.closest("[data-act]");
  if (!a) return;
  if (a.dataset.act === "resetcolors") { S.colors = {}; applyColors(); save(); render(); return; }
  if (a.dataset.act === "export") { exportPrefs(); return; }
  if (a.dataset.act === "import") { $("importin").click(); return; }
  if (a.dataset.act === "qr") { showQr = !showQr; loadQr(render); render(); }
  if (a.dataset.act === "clear") {
    openSheet('<div class="grab"></div><div class="shead"><div class="sect">CLEAR SAVED TELLS?</div></div><div class="sfoot">This deletes the saved tell files on the bridge. Tells from this session stay until the bridge stops.</div><div class="sbtns"><button class="sec" data-sb="x">Cancel</button><button class="pri" data-sb="ok" style="background:var(--bad)">Clear</button></div>', function (e2) {
      var b = e2.target.closest("[data-sb]");
      if (!b) return;
      closeSheet();
      if (b.dataset.sb === "ok") api("/api/tells/clear", {}).then(function (j) { toast(j.ok ? "Saved tells cleared." : (j.error || "Could not clear.")); });
    });
  }
});

// ------------------------------------------------------------------------------------------
// Navigation, sheets, banners
// ------------------------------------------------------------------------------------------
var curTab = "chat", stack = [], histOK = true;
function showTab(name, cseg) {
  var again = name === curTab && !stack.length;
  while (stack.length) { $("scr-" + stack.pop()).classList.remove("open"); }
  curTab = name;
  if (cseg) S.cseg = cseg;
  document.querySelectorAll("#tabbar button").forEach(function (x) { x.classList.toggle("on", x.dataset.tab === name); });
  document.querySelectorAll(".tab").forEach(function (t) { t.classList.toggle("on", t.id === "tab-" + curTab); });
  if (curTab === "alerts") S.seenAlerts = nowSec();
  if (curTab === "cmds") showCseg();
  if (again) {   // tap the tab you're on: jump to the latest
    var pane = name === "chat" ? $("pane-chat") : (name === "cmds" ? $("pane-cmd") : null);
    if (pane) { pane.scrollTop = pane.scrollHeight; seenCount[pane.id] = undefined; }
    var list = name === "tells" ? $("tells-list") : (name === "alerts" ? $("alerts") : (name === "cmds" ? $("emotes") : null));
    if (list) list.scrollTop = 0;
  }
  save(); render();
}
document.getElementById("tabbar").addEventListener("click", function (e) {
  var b = e.target.closest("[data-tab]");
  if (b) showTab(b.dataset.tab);
});
function showCseg() {
  var em = S.cseg !== "server";
  $("cp-emote").hidden = !em;
  $("cp-server").hidden = em;
  document.querySelectorAll("#cmdseg button").forEach(function (b) { b.classList.toggle("on", b.dataset.cseg === (em ? "emote" : "server")); });
  if (em) renderEmotes(); else renderCmd();
}
$("cmdseg").addEventListener("click", function (e) {
  var b = e.target.closest("[data-cseg]");
  if (!b) return;
  S.cseg = b.dataset.cseg; save(); showCseg();
});
function go(name) {
  var el = $("scr-" + name);
  if (!el) return;
  if (name === "cmdlist") { $("cmdsearch").value = ""; renderCmdList(); }
  if (name === "settings") refreshStatus();
  stack.push(name);
  el.style.zIndex = (el.classList.contains("tabs") ? 5 : 20) + stack.length;
  el.classList.add("open");
  try { history.pushState({s: stack.length}, ""); } catch (e) { histOK = false; }
  render();
}
function back() {
  var name = stack.pop();
  if (!name) return;
  $("scr-" + name).classList.remove("open");
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  render();
}
window.addEventListener("popstate", function () { if ($("sheet").classList.contains("on")) { closeSheet(); return; } if (stack.length) back(); });
document.addEventListener("click", function (e) {
  if (e.target.closest("[data-tipok]")) { S.tipSeen = true; save(); render(); return; }
  if (e.target.closest("[data-bandis]")) { S.tellsBan = true; save(); render(); return; }
  var g = e.target.closest("[data-go]");
  if (g) { go(g.dataset.go); return; }
  if (e.target.closest("[data-back]")) { if (stack.length) { if (histOK) history.back(); else back(); } }
  if (e.target.closest("a")) return;
  var fc = e.target.closest("[data-focus]");
  if (fc && fc.closest(".pane")) { openFocus(fc.dataset.focus); return; }
  var w = e.target.closest("[data-who]");
  if (w && w.closest(".pane")) {
    var ch = w.dataset.ch, who = w.dataset.who;
    if (ch === "tell" && who) { openThread(who); return; }
    if (who && who.toLowerCase() !== myName().toLowerCase()) {
      if (w.closest("#pane-chat")) replyTo({ch: "tell", peer: who}, w.closest("[data-reply]"), true);
      else openThread(who);
      return;
    }
    if (CH[ch]) openFocus(ch);
    return;
  }
  var r = e.target.closest("[data-reply]");
  if (r && r.closest("#pane-chat")) {
    var sel = window.getSelection && window.getSelection();
    if (sel && String(sel).length) return;
    var rc = r.dataset.reply;
    if (rc === "tell") { if (r.dataset.peer) openThread(r.dataset.peer); return; }
    if (SENDABLE.indexOf(rc) >= 0) replyTo({ch: rc, peer: ""}, r, false);
  }
});
function openFocus(ch) {
  if (!CH[ch]) return;
  focus.ch = ch; focus.filter = "all"; seenCount["pane-focus"] = undefined; go("focus");
}
function replyTo(t, lineEl, typeNow) {
  var same = S.target && S.target.ch === t.ch && (S.target.peer || "") === (t.peer || "");
  S.target = t; save(); updateComposers();
  if (lineEl) { lineEl.classList.remove("picked"); void lineEl.offsetWidth; lineEl.classList.add("picked"); }
  var comp = document.querySelector('[data-comp="chat"]');
  if (comp && !same) {
    var chip = comp.querySelector(".tgt");
    if (chip) { chip.classList.remove("bump"); void chip.offsetWidth; chip.classList.add("bump"); }
  }
  if (typeNow && comp) comp.querySelector("input").focus();
}
$("focus-filters").addEventListener("click", function (e) {
  var b = e.target.closest("[data-f]");
  if (!b) return;
  focus.filter = b.dataset.f; seenCount["pane-focus"] = undefined; render();
});
var sheetHandler = null;
function openSheet(html, onClick) {
  $("sheet").innerHTML = html;
  sheetHandler = onClick;
  $("scrim").classList.add("on");
  $("sheet").classList.add("on");
}
function closeSheet() {
  $("scrim").classList.remove("on");
  $("sheet").classList.remove("on");
  sheetHandler = null;
}
$("sheet").addEventListener("click", function (e) { if (sheetHandler) sheetHandler(e); });
$("scrim").addEventListener("click", closeSheet);

function banner() {
  if (linkDead) {
    return '<div class="banner bad"><b>This link was replaced</b>Scan the new QR (<span class="code">/pchat config</span> in game).</div>';
  }
  if (!connected && everConnected && Date.now() - offlineSince > 3000) {
    return '<div class="banner bad"><b>Bridge offline. Reconnecting...</b>Start it with <span class="code">/pchat start</span>. If the Deck\'s address changed, scan the QR again.</div>';
  }
  if (!connected && !everConnected && Date.now() - offlineSince > 4000) {
    return '<div class="banner bad"><b>Can\'t reach the bridge</b>Same Wi-Fi as the Deck or PC? Is the bridge on?</div>';
  }
  if (connected && !status.char) {
    return '<div class="banner info"><b>Waiting for the game</b>Log in and chat shows up here.</div>';
  }
  if (connected && !S.tipSeen) {
    return '<div class="banner info">Tip: tap Share, then Add to Home Screen. <button class="linkbtn" data-tipok>Got it</button></div>';
  }
  return "";
}

// ------------------------------------------------------------------------------------------
// Render loop
// ------------------------------------------------------------------------------------------
var queued = false;
function schedule() { if (!queued) { queued = true; requestAnimationFrame(function () { queued = false; render(); }); } }
function render() {
  document.querySelectorAll("[data-bridge]").forEach(function (p) {
    p.classList.toggle("off", !connected);
    p.querySelector("span").textContent = connected ? "Bridge ON" : "Bridge OFF";
  });
  var b = banner();
  $("ban-chat").innerHTML = b;
  renderViews();
  if (curTab === "chat") renderPane("pane-chat", chatItems(), "chat", "No messages yet.");
  renderTells();
  if (curTab === "tells" && b) $("ban-tells").innerHTML = b + $("ban-tells").innerHTML;
  renderMotd();
  renderAlerts();
  var top = stack[stack.length - 1];
  if (top === "focus") {
    var c = CH[focus.ch];
    $("focus-title").innerHTML = ico(c.icon, 22) + "<b>" + c.full + "</b>";
    $("focus-sub").textContent = focus.filter === "all" ? (lsName[focus.ch] || "Just this channel") : (focus.filter === "calls" ? "Only calls" : "Only links");
    $("focus-filters").innerHTML = [["all", "All"], ["calls", "Calls"], ["links", "Links"]].map(function (f) { return '<button class="chipb' + (focus.filter === f[0] ? " on" : "") + '" data-f="' + f[0] + '">' + f[1] + "</button>"; }).join("");
    renderPane("pane-focus", focusItems(), "focus", "Nothing here yet.");
  }
  if (top === "thread") {
    S.read[thread.peer.toLowerCase()] = nowSec();
    renderPane("pane-thread", threadItems(), "thread", "No tells with " + esc(thread.peer) + " yet. Say hi.");
  }
  if (curTab === "cmds" && S.cseg === "server") renderCmd();
  if (top === "settings") renderSettings();
  updateComposers();
}

// ------------------------------------------------------------------------------------------
// Keyboard: keep the composer just above the iPhone keyboard, newest line in view.
// ------------------------------------------------------------------------------------------
var app = $("app");
function setTabH() {
  var h = document.body.classList.contains("typing") ? 0 : $("tabbar").offsetHeight;
  app.style.setProperty("--tabh", h + "px");
}
new MutationObserver(setTabH).observe(document.body, {attributes: true, attributeFilter: ["class"]});
window.addEventListener("resize", setTabH);
// Only follow the visual viewport while the keyboard is up. Otherwise let #app fill the screen:
// Home Screen apps report a short viewport, which left a dark band under the tab bar.
var kbUp = false;
// The full height is measured while no keyboard is up. On a Home Screen app iOS sometimes shrinks
// innerHeight along with the keyboard, which made the old "visible < window" check miss and left the
// composer hidden behind the keys.
var fullH = window.innerHeight;
function fitViewport() {
  var vv = window.visualViewport;
  if (!vv) return;
  var typing = document.body.classList.contains("typing");
  if (!typing) fullH = Math.max(window.innerHeight, vv.height);
  var shrunk = fullH - vv.height > 80;
  if (typing && shrunk) {
    app.style.height = vv.height + "px";
    app.style.transform = "translateY(" + vv.offsetTop + "px)";
  } else {
    app.style.height = "";
    app.style.transform = "";
  }
  if (window.scrollY) window.scrollTo(0, 0);
  var up = typing && shrunk;
  if (up !== kbUp) { kbUp = up; pinPanes(); }
}
function pinPanes() {
  // Keyboard opened or closed: keep the newest line in view, but only where the reader was at the bottom.
  ["pane-chat", "pane-focus", "pane-thread", "pane-cmd"].forEach(function (id) {
    var p = $(id);
    if (p && (p._count === undefined || p.scrollHeight - p.scrollTop - p.clientHeight < 200)) p.scrollTop = p.scrollHeight;
  });
}
if (window.visualViewport) {
  window.visualViewport.addEventListener("resize", fitViewport);
  window.visualViewport.addEventListener("scroll", fitViewport);
}
new MutationObserver(function () {
  fitViewport();
  // iOS reports the keyboard late and sometimes only once, so look again a few times after focus.
  if (document.body.classList.contains("typing")) [120, 350, 700, 1200].forEach(function (ms) { setTimeout(fitViewport, ms); });
}).observe(document.body, {attributes: true, attributeFilter: ["class"]});
window.addEventListener("orientationchange", function () { setTimeout(fitViewport, 300); });

// ------------------------------------------------------------------------------------------
// Start
// ------------------------------------------------------------------------------------------
applyLook();
setWatch();
buildComposers();
render();
setTabH();
if (!TOKEN) {
  $("ban-chat").innerHTML = '<div class="banner bad"><b>Missing link token</b>Scan the QR in <span class="code">/pchat config</span>, or open the full link (it ends in ?t=...).</div>';
} else {
  connect();
  syncPrefs();
  getJSON("/api/commands").then(function (j) { commands = j; renderCmdList(); if (curTab === "cmds") showCseg(); }).catch(function () {});
  setInterval(refreshStatus, 30000);
  setInterval(function () { if (!connected) render(); }, 2000);
  setInterval(function () { if (curTab === "alerts") schedule(); }, 30000);
  setInterval(function () { if (curTab === "alerts") tickCd(); }, 1000);   // lets old venture cards fade
}
})();
</script>
