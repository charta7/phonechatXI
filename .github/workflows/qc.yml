name: Release QC
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  qc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install lupa==2.8
      - run: node tools/test_qc.js
      - run: python tools/test_qc.py
      - run: python tools/build_zip.py
      - run: python tools/check_zip.py
      - uses: actions/upload-artifact@v4
        with:
          name: phonechatXI-test-build
          path: dist/*.zip
